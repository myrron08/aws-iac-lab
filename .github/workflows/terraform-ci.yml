name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.tf"
      - "**/*.tf"
      - "lambda/**"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-ci.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::432342420991:role/aws-iac-lab-dev-github-plan-role
          role-session-name: terraform-ci
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "432342420991"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m